<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="家庭學習題庫" />
  <title>家庭學習工具總入口</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
    }
    .card-press { transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .card-press:active { transform: scale(0.98); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-4xl mx-auto px-5 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-xl shadow-sm">
          學
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 leading-tight">家庭學習工具中心</h1>
          <p class="text-xs text-slate-500">跨裝置互動練習與知識庫入口</p>
        </div>
      </div>
      <span id="date-badge" class="text-xs font-medium bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full"></span>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto px-5 py-8">
    <div class="mb-6">
      <h2 class="text-base font-semibold text-slate-700">請選擇今天要練習的科目</h2>
      <p class="text-sm text-slate-500 mt-0.5">點擊卡片即可進入全螢幕互動練習模式</p>
    </div>

    <div id="subjects-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-5"></div>

    <div class="mt-10 bg-white border border-slate-200 rounded-2xl p-5 text-sm text-slate-600">
      <div class="font-semibold text-slate-800 mb-1.5 flex items-center gap-2">
        <span>📱</span>
        <span>iPad 與電腦使用小提示</span>
      </div>
      <ul class="list-disc list-inside space-y-1 text-slate-500 text-xs sm:text-sm">
        <li>在 iPad Safari 點擊「分享」並選擇「加入主畫面」，即可像原生 App 一樣全螢幕操作。</li>
        <li>進入各科測驗後，點擊右上角的「返回首頁」即可隨時回到此畫面切換科目。</li>
      </ul>
    </div>
  </main>

  <script>
    // ==========================================
    // 【科目卡片設定區】日後新增科目只要在這裡加一組即可
    // ==========================================
    const SUBJECTS = [
      {
        id: "math-g6",
        title: "國小六年級數學（翰林版）",
        subtitle: "六上重點題庫・含詳解解析與手寫草稿紙",
        tag: "數學",
        icon: "📐",
        color: "blue",
        link: "./math-g6/index.html"
      },
      {
        id: "english-practice",
        title: "國小英文練習本（三年級／六年級）",
        subtitle: "單字、聽力、文法、寫作與小學英檢模擬測驗",
        tag: "英文",
        icon: "🔤",
        color: "emerald",
        link: "./english-practice/index.html"
      }
    ];

    const COLOR_STYLES = {
      blue: { bg: "bg-blue-50", text: "text-blue-700", border: "hover:border-blue-400", badge: "bg-blue-100 text-blue-700" },
      emerald: { bg: "bg-emerald-50", text: "text-emerald-700", border: "hover:border-emerald-400", badge: "bg-emerald-100 text-emerald-700" },
      amber: { bg: "bg-amber-50", text: "text-amber-700", border: "hover:border-amber-400", badge: "bg-amber-100 text-amber-700" }
    };

    const now = new Date();
    document.getElementById("date-badge").textContent = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()}`;

    const grid = document.getElementById("subjects-grid");
    SUBJECTS.forEach(item => {
      const style = COLOR_STYLES[item.color] || COLOR_STYLES.blue;
      const card = document.createElement("a");
      card.href = item.link;
      card.className = `card-press block bg-white border border-slate-200 ${style.border} rounded-2xl p-6 shadow-sm hover:shadow-md transition-all`;
      card.innerHTML = `
        <div class="flex items-start justify-between mb-4">
          <div class="w-12 h-12 rounded-2xl ${style.bg} flex items-center justify-center text-2xl">${item.icon}</div>
          <span class="text-xs font-bold px-2.5 py-1 rounded-full ${style.badge}">${item.tag}</span>
        </div>
        <h3 class="text-lg font-bold text-slate-900 mb-1.5">${item.title}</h3>
        <p class="text-sm text-slate-500 leading-relaxed mb-4">${item.subtitle}</p>
        <div class="flex items-center text-sm font-semibold ${style.text}">
          <span>開始練習</span>
          <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
